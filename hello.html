<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>안녕하세요, 임정은입니다</title>
  <style>
    :root {
      --bg: #fff8f6;
      --fg: #2b1d1d;
      --muted: #7a6464;
      --accent: #d6336c;
      --card: #ffffff;
      --line: #f3d9d9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1d1416;
        --fg: #f6e9e9;
        --muted: #b9a3a3;
        --accent: #ff7aa2;
        --card: #281b1e;
        --line: #3d2a2e;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      line-height: 1.6;
    }
    main {
      width: 100%;
      max-width: 480px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 32px 28px;
    }
    h1 { margin: 0 0 4px; font-size: 1.75rem; color: var(--accent); }
    .intro { margin: 0 0 24px; color: var(--muted); }
    h2 { margin: 0 0 6px; font-size: 0.85rem; letter-spacing: 0.04em; color: var(--muted); }
    p.value { margin: 0; }
  </style>
</head>
<body>
  <main>
    <h1>임정은</h1>
    <p class="intro">AI 프로덕트 매니저 과정 수강생</p>

    <h2>좋아하는 것</h2>
    <p class="value">비밀이야</p>
  </main>
</body>
</html>
