<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>셀렉트마켓 · 이번 주 특가</title>
<style>
  :root {
    --bg-1: #fff4c7;
    --bg-2: #fffdf7;
    --panel: #fffdf9;
    --card: #fff5bf;
    --card-strong: #ffd44d;
    --accent: #f7b500;
    --accent-deep: #d98900;
    --accent-soft: #fff1b3;
    --text: #2d2108;
    --muted: #705d2a;
    --line: #f1d777;
    --shadow: rgba(189, 126, 0, 0.14);
  }

  * { box-sizing: border-box; }

  html {
    scroll-behavior: smooth;
  }

  body {
    margin: 0;
    font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    color: var(--text);
    background:
      radial-gradient(circle at top, rgba(255, 226, 125, 0.8), transparent 32%),
      linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
  }

  header, main, footer {
    max-width: 680px;
    margin: 0 auto;
    padding: 28px 18px 18px;
  }

  header {
    padding-top: 32px;
  }

  .brand {
    display: inline-block;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.12em;
    color: var(--accent-deep);
    background: linear-gradient(180deg, #fff8d9, #ffe9a3);
    border: 1px solid rgba(217, 137, 0, 0.25);
    border-radius: 999px;
    padding: 8px 14px;
    margin-bottom: 12px;
    box-shadow: 0 6px 12px rgba(247, 181, 0, 0.12);
  }

  h1 {
    font-size: clamp(30px, 4vw, 42px);
    line-height: 1.15;
    margin: 0;
    letter-spacing: -0.05em;
  }

  main {
    padding-top: 8px;
  }

  .card {
    position: relative;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.22) 0%, rgba(255, 244, 181, 0.9) 100%);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 18px 18px 16px;
    margin: 16px 0;
    box-shadow: 0 10px 24px var(--shadow);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 18px;
    overflow: hidden;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .card::before {
    content: "";
    position: absolute;
    inset: 0 auto 0 0;
    width: 8px;
    background: linear-gradient(180deg, var(--accent) 0%, var(--accent-deep) 100%);
    border-radius: 22px 0 0 22px;
  }

  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 28px rgba(198, 128, 0, 0.12);
  }

  .product {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-left: 12px;
  }

  .badge {
    display: inline-block;
    width: fit-content;
    background: rgba(255, 208, 80, 0.35);
    color: var(--accent-deep);
    border: 1px solid rgba(247, 181, 0, 0.35);
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    padding: 5px 8px;
    text-transform: uppercase;
  }

  .card h2 {
    margin: 0;
    font-size: 22px;
    font-weight: 800;
    color: var(--text);
    letter-spacing: -0.02em;
  }

  .price {
    margin: 0;
    color: var(--accent-deep);
    font-size: clamp(20px, 2vw, 24px);
    font-weight: 900;
    white-space: nowrap;
    background: linear-gradient(180deg, rgba(255, 240, 176, 0.9), rgba(255, 214, 94, 0.8));
    border: 1px solid rgba(247, 181, 0, 0.45);
    border-radius: 12px;
    padding: 10px 14px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
  }

  footer {
    color: var(--muted);
    font-size: 13px;
    padding-top: 18px;
  }

  footer p {
    margin: 0;
  }

  @media (max-width: 480px) {
    .card {
      flex-direction: column;
      align-items: flex-start;
    }

    .product {
      margin-left: 8px;
    }

    .price {
      width: 100%;
      text-align: center;
    }
  }
</style>
</head>
<body>
<header>
  <div class="brand">셀렉트마켓</div>
  <h1>이번 주 특가 3가지</h1>
</header>
<main>
  <article class="card">
    <div class="product">
      <span class="badge">특가</span>
      <h2>무선 마우스</h2>
    </div>
    <p class="price">19,000원</p>
  </article>
  <article class="card">
    <div class="product">
      <span class="badge">특가</span>
      <h2>노트북 거치대</h2>
    </div>
    <p class="price">25,000원</p>
  </article>
  <article class="card">
    <div class="product">
      <span class="badge">특가</span>
      <h2>USB-C 충전기</h2>
    </div>
    <p class="price">15,000원</p>
  </article>
</main>
<footer>
  <p>고객센터 평일 10:00–17:00</p>
</footer>
</body>
</html>
